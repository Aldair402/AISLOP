name: CI

on:
  push:
    branches: [main, "trabajo/*", "documentacion/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quick:
    name: quick (cargo + registry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: cargo test
        run: cargo test --manifest-path mc-aot/Cargo.toml
      - name: registry and partition
        run: |
          python3 mc-aot/tools/check-class-registry.py
          python3 mc-aot/tools/check-family-partition.py
      - name: baseline guard
        run: test -f analysis/c01-baseline-2026-11-05.md || echo "baseline missing (expected before C-01 merge)"

  focused:
    name: focused (JAR oracles, no full suite)
    runs-on: ubuntu-latest
    needs: quick
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: check JAR present
        run: |
          test -f downloads/server-26.3-inner.jar || test -f downloads/server-26.3.jar || { echo "::warning::JAR not in repo (downloads/ gitignored). Focused tests will be skipped."; exit 0; }
          sha256sum downloads/server-26.3-inner.jar | head
      - name: focused checks (if JAR available)
        run: |
          if [ -f downloads/server-26.3-inner.jar ]; then
            python3 mc-aot/tests/check-quartpos-class-surface.py
            python3 mc-aot/tests/check-numeric-bridge-layout.py
            python3 mc-aot/tests/check-numeric-auto-publish.py
            python3 mc-aot/tests/check-futures-contract.py
            python3 mc-aot/tests/check-rayon-pending-future.py
          else
            echo "skip - no JAR"
          fi

  full:
    name: full regressions (manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TMPDIR: ${{ runner.temp }}
      JAVA_HOME: /usr/lib/jvm/temurin-25-jdk-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: run full suite
        run: |
          echo "TMPDIR=$TMPDIR CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          df -h /tmp || true
          df -h . || true
          bash mc-aot/run-regressions.sh
          echo "EXIT=$?"
          tail -20 analysis/full-regressions-*.log 2>&1 | head -n 40 || true
          echo "etapas: $(grep -c '^==> ' analysis/full-regressions-*.log | head -1)"
      - name: upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regressions-log
          path: analysis/full-regressions-*.log
          if-no-files-found: warn
          retention-days: 7

