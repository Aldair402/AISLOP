name: CI

on:
  push:
    branches: [main, "trabajo/*", "documentacion/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Official Mojang server bundle (README §Descarga). Pinned by SHA-1 and the
  # extracted inner JAR by SHA-256, so a corrupted or stale download fails loud.
  SERVER_JAR_URL: https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar
  SERVER_JAR_SHA1: 33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c
  INNER_JAR_SHA256: a362163eec5d1612d520772bc16e5b39c09e3b234fdc045f56bf544284ee8ae6

jobs:
  quick:
    name: quick (cargo + registry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('mc-aot/Cargo.lock', 'mc-aot/log4rs-prototype/Cargo.lock') }}
      - name: cache server jars
        uses: actions/cache@v4
        with:
          path: downloads
          key: server-jars-26.3-${{ env.INNER_JAR_SHA256 }}
      - name: fetch server jar (Mojang official, verified)
        run: bash mc-aot/ci/fetch-server-jar.sh
      - name: cargo test
        run: cargo test --manifest-path mc-aot/Cargo.toml
      - name: registry and partition
        run: |
          python3 mc-aot/tools/check-class-registry.py
          python3 mc-aot/tools/check-family-partition.py
      - name: baseline guard
        run: |
          if [ -f analysis/c01-baseline-2026-11-05.md ]; then
            echo "baseline present"
          else
            echo "::warning::C-01 baseline file missing (expected until c-01-baseline is merged)"
          fi

  focused:
    name: focused (JAR oracles, no full suite)
    runs-on: ubuntu-latest
    needs: quick
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('mc-aot/Cargo.lock', 'mc-aot/log4rs-prototype/Cargo.lock') }}
      - name: cache server jars
        uses: actions/cache@v4
        with:
          path: downloads
          key: server-jars-26.3-${{ env.INNER_JAR_SHA256 }}
      - name: fetch server jar (Mojang official, verified)
        run: bash mc-aot/ci/fetch-server-jar.sh
      - name: tmpdir outside small tmpfs
        run: |
          # B-02 hit "No space left on device" with the 992M runner tmpfs; give
          # the JVM and cargo temp files a workspace-backed dir with room.
          # CARGO_TARGET_DIR is intentionally NOT overridden: the checks read
          # mc-aot/target/debug/mc-aot by path.
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/tmp" >> "$GITHUB_ENV"
          df -h /tmp
      - name: prime cargo cache for offline checks
        run: cargo fetch --manifest-path mc-aot/Cargo.toml
      - name: check-quartpos-class-surface
        run: python3 mc-aot/tests/check-quartpos-class-surface.py
      - name: check-numeric-bridge-layout
        run: python3 mc-aot/tests/check-numeric-bridge-layout.py
      - name: check-numeric-auto-publish
        run: python3 mc-aot/tests/check-numeric-auto-publish.py
      - name: check-futures-contract
        run: python3 mc-aot/tests/check-futures-contract.py
      - name: check-rayon-pending-future
        run: python3 mc-aot/tests/check-rayon-pending-future.py

  full:
    name: full regressions (manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('mc-aot/Cargo.lock', 'mc-aot/log4rs-prototype/Cargo.lock') }}
      - name: cache server jars
        uses: actions/cache@v4
        with:
          path: downloads
          key: server-jars-26.3-${{ env.INNER_JAR_SHA256 }}
      - name: fetch server jar (Mojang official, verified)
        run: bash mc-aot/ci/fetch-server-jar.sh
      - name: tmpdir outside small tmpfs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/tmp" >> "$GITHUB_ENV"
          df -h /tmp
          df -h .
      - name: prime cargo cache for offline checks
        run: cargo fetch --manifest-path mc-aot/Cargo.toml
      - name: run full suite
        run: |
          echo "TMPDIR=$TMPDIR JAVA_HOME=$JAVA_HOME"
          bash mc-aot/run-regressions.sh
          echo "EXIT=$?"
          tail -20 analysis/full-regressions-*.log 2>&1 | head -n 40 || true
          echo "etapas: $(grep -c '^==> ' analysis/full-regressions-*.log | head -1)"
      - name: upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regressions-log
          path: analysis/full-regressions-*.log
          if-no-files-found: warn
          retention-days: 7
